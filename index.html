<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ASCII City — Version 4</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <canvas id="gameCanvas"></canvas>


    <div id="hud">

        <div class="title">
            ASCII CITY
        </div>

        <div id="status">
            Generating city...
        </div>

        <div id="time">
            DAY
        </div>

        <div id="seed">
            SEED: ------
        </div>

        <div class="controls">

            W A S D — Move<br>
            ← → — Turn<br>
            Mouse — Look<br>
            N — Day/Night<br>
            R — Generate City<br>
            ESC — Release Mouse

        </div>

    </div>


    <div id="crosshair">
        +
    </div>


    <div id="minimap">

        <canvas id="minimapCanvas"></canvas>

    </div>


    <script
        type="module"
        src="js/main.js"
    ></script>

</body>

</html>
